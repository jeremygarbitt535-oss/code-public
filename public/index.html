<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Venmo Arbitrageur</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#22c55e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Arbitrageur">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
      padding: 20px;
      background: #0f172a;
      color: #e2e8f0;
      line-height: 1.5;
    }
    .container { max-width: 900px; margin: 0 auto; }
    h1 { margin: 0 0 8px; font-size: 28px; }
    .sub { color: #94a3b8; margin-bottom: 24px; }
    .card {
      background: #1e293b;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
      border: 1px solid #334155;
    }
    button, a.btn {
      background: #3b82f6;
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 15px;
      cursor: pointer;
      margin-right: 8px;
      text-decoration: none;
      display: inline-block;
    }
    button:hover, a.btn:hover { background: #2563eb; }
    button.secondary, a.secondary { background: #475569; }
    button.premium, a.premium { background: #22c55e; }
    button.premium:hover, a.premium:hover { background: #16a34a; }
    .opp {
      background: #0f172a;
      border-left: 4px solid #22c55e;
      padding: 12px;
      margin: 8px 0;
      border-radius: 8px;
    }
    .opp.high { border-left-color: #f59e0b; }
    .opp.locked {
      border-left-color: #64748b;
      opacity: 0.7;
      position: relative;
    }
    .opp.locked::after {
      content: 'PREMIUM';
      position: absolute;
      top: 8px;
      right: 8px;
      background: #22c55e;
      color: white;
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 600;
    }
    .yield { font-size: 20px; font-weight: 600; color: #22c55e; }
    .meta { font-size: 13px; color: #94a3b8; }
    #status { font-size: 13px; color: #64748b; }
    #scans { font-size: 14px; color: #fbbf24; margin-top: 8px; }
    #countdown { font-size: 13px; color: #94a3b8; margin-top: 4px; }
    input {
      background: #0f172a;
      border: 1px solid #334155;
      color: #e2e8f0;
      padding: 8px 12px;
      border-radius: 8px;
      width: 100%;
      max-width: 400px;
    }
    .upgrade-banner {
      background: #1e293b;
      border: 1px solid #22c55e;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
      text-align: center;
    }
    #emailMsg { font-size: 13px; color: #22c55e; margin-top: 8px; }
    .actions { margin-top: 12px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Venmo Arbitrageur</h1>
    <p class="sub">Opportunity scanner and net yield calculator</p>

    <div class="upgrade-banner" id="upgradeBanner" style="display:none;">
      <strong>You've used all free scans today.</strong><br>
      <span id="bannerCountdown"></span><br>
      <a class="btn premium" href="/premium.html" style="margin-top:10px;">Unlock Unlimited — $19</a>
    </div>

    <div class="card">
      <div id="status">Connecting...</div>
      <div id="scans"></div>
      <div id="countdown"></div>
      <div class="actions">
        <button id="scan">Scan Opportunities</button>
        <button class="secondary" id="balance">Check Balance</button>
        <button class="secondary" id="export">Export CSV</button>
        <a class="btn premium" href="/premium.html">Premium Features</a>
      </div>
      <div style="margin-top: 12px; display:flex; gap:8px; flex-wrap:wrap; align-items:center;">
        <label style="font-size:14px; color:#94a3b8;">Min yield $</label>
        <input type="number" id="threshold" step="0.1" min="0" value="0.5" style="max-width:100px;" />
        <input id="token" placeholder="Plaid access token (optional)" style="flex:1;" />
      </div>
    </div>

    <div class="card">
      <strong>Get alerts when high-yield windows open</strong>
      <p style="color:#94a3b8; font-size:14px; margin:8px 0;">Enter your email. We'll only send when something worth scanning appears.</p>
      <form id="emailForm" style="display:flex; gap:8px; flex-wrap:wrap;">
        <input type="email" id="email" placeholder="you@email.com" required style="flex:1; min-width:200px;" />
        <button type="submit" class="premium">Notify Me</button>
      </form>
      <div id="emailMsg"></div>
    </div>

    <div id="results"></div>
  </div>

  <script>
    const statusEl = document.getElementById('status');
    const scansEl = document.getElementById('scans');
    const countdownEl = document.getElementById('countdown');
    const resultsEl = document.getElementById('results');
    const tokenEl = document.getElementById('token');
    const thresholdEl = document.getElementById('threshold');
    const upgradeBanner = document.getElementById('upgradeBanner');
    const bannerCountdown = document.getElementById('bannerCountdown');
    const emailForm = document.getElementById('emailForm');
    const emailMsg = document.getElementById('emailMsg');

    let lastResults = [];

    const savedThreshold = localStorage.getItem('yieldThreshold');
    if (savedThreshold) thresholdEl.value = savedThreshold;
    thresholdEl.onchange = () => localStorage.setItem('yieldThreshold', thresholdEl.value);

    function getHoursUntilReset() {
      const now = new Date();
      const tomorrow = new Date(now);
      tomorrow.setUTCDate(tomorrow.getUTCDate() + 1);
      tomorrow.setUTCHours(0, 0, 0, 0);
      const ms = tomorrow - now;
      return Math.ceil(ms / (1000 * 60 * 60));
    }

    function updateCountdown() {
      const hours = getHoursUntilReset();
      const text = `Free scans reset in ~${hours} hour${hours !== 1 ? 's' : ''}`;
      countdownEl.textContent = text;
      if (bannerCountdown) bannerCountdown.textContent = text;
    }
    updateCountdown();
    setInterval(updateCountdown, 60000);

    async function updateScans() {
      try {
        const res = await fetch('/scans-remaining');
        const data = await res.json();
        scansEl.textContent = `Free scans remaining today: ${data.remaining} / ${data.limit}`;
        if (data.remaining === 0) upgradeBanner.style.display = 'block';
      } catch (_) {}
    }
    updateScans();

    emailForm.onsubmit = async (e) => {
      e.preventDefault();
      emailMsg.textContent = 'Thanks — you\'re on the list. (Alerts coming soon.)';
      emailForm.reset();
    };

    let ws;
    function connect() {
      const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
      ws = new WebSocket(`${proto}//${location.host}`);
      ws.onmessage = (e) => {
        const msg = JSON.parse(e.data);
        if (msg.type === 'connected') {
          statusEl.textContent = `Connected · Plaid ${msg.plaid ? 'configured' : 'demo mode'}`;
        } else if (msg.type === 'opportunity') {
          renderOpp(msg.data);
        }
      };
      ws.onclose = () => {
        statusEl.textContent = 'Disconnected — retrying...';
        setTimeout(connect, 2000);
      };
    }
    connect();

    function renderOpp(opp, locked = false) {
      const div = document.createElement('div');
      div.className = 'opp' + (opp.riskLevel === 'High' ? ' high' : '') + (locked ? ' locked' : '');
      div.innerHTML = `
        <div style="display:flex;justify-content:space-between;align-items:baseline;">
          <strong>${opp.name || opp.id}</strong>
          <span class="yield">+$${opp.net.toFixed(2)}</span>
        </div>
        <div class="meta">${opp.method} · ${opp.riskLevel} risk · gross $${opp.gross.toFixed(2)}</div>
        <div style="margin-top:6px;font-size:14px;">${opp.description || ''}</div>
        <div style="margin-top:8px;">
          ${locked ? '<a href="/premium.html" style="color:#22c55e;font-size:13px;">Unlock to view details</a>' : `
            <button style="padding:6px 12px;font-size:13px;" onclick="execute('${opp.id}')">Execute (sim)</button>
            <button style="padding:6px 12px;font-size:13px;" class="secondary" onclick="shareOpp('${opp.name || opp.id}', ${opp.net})">Share</button>
          `}
        </div>
      `;
      resultsEl.prepend(div);
    }

    function addLockedOpportunity() {
      renderOpp({
        id: 'premium-locked',
        name: 'High-Yield Premium Window',
        method: 'Venmo',
        net: 4.25,
        gross: 4.80,
        riskLevel: 'Low',
        description: 'A higher-yield opportunity only visible with Premium.'
      }, true);
    }

    async function scan() {
      resultsEl.innerHTML = '';
      lastResults = [];
      const token = tokenEl.value.trim();
      const minYield = parseFloat(thresholdEl.value) || 0;
      const res = await fetch('/scan', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ accessToken: token || undefined }),
      });
      const data = await res.json();
      if (res.status === 402) {
        upgradeBanner.style.display = 'block';
        scansEl.textContent = 'Free scans remaining today: 0';
        resultsEl.innerHTML = `<div class="card">${data.message || 'Free limit reached.'} <a href="/premium.html" style="color:#22c55e;">Unlock Premium</a></div>`;
        addLockedOpportunity();
        return;
      }
      if (data.yields) {
        const filtered = data.yields.filter(o => o.net >= minYield);
        lastResults = filtered;
        filtered.forEach(o => renderOpp(o));
        if (!filtered.length) {
          resultsEl.innerHTML = '<div class="card">No opportunities above your threshold.</div>';
        }
        addLockedOpportunity();
      }
      if (data.scansRemaining !== undefined) {
        scansEl.textContent = `Free scans remaining today: ${data.scansRemaining}`;
        if (data.scansRemaining === 0) upgradeBanner.style.display = 'block';
      }
      statusEl.textContent = `Scanned ${data.scanned || 0} · ${data.yields?.length || 0} profitable (showing ≥ $${minYield})`;
    }

    async function checkBalance() {
      const token = tokenEl.value.trim();
      const res = await fetch('/balance' + (token ? '?accessToken=' + encodeURIComponent(token) : ''));
      const data = await res.json();
      statusEl.textContent = data.error
        ? 'Balance error: ' + data.error
        : `Available: $${(data.available || 0).toFixed(2)} (${data.source || 'unknown'})`;
    }

    function exportCSV() {
      if (!lastResults.length) {
        alert('Scan first to export results.');
        return;
      }
      const headers = ['Name', 'Method', 'Net Yield', 'Gross', 'Risk', 'Description'];
      const rows = lastResults.map(o => [
        `"${(o.name || o.id).replace(/"/g, '""')}"`,
        `"${o.method}"`,
        o.net,
        o.gross,
        o.riskLevel,
        `"${(o.description || '').replace(/"/g, '""')}"`
      ].join(','));
      const csv = [headers.join(','), ...rows].join('\n');
      const blob = new Blob([csv], { type: 'text/csv' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'venmo-opportunities.csv';
      a.click();
      URL.revokeObjectURL(url);
    }

    window.execute = async (id) => {
      const res = await fetch('/execute', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ opportunityId: id }),
      });
      const data = await res.json();
      alert(data.message || 'Done');
    };

    window.shareOpp = (name, net) => {
      const text = `Found a $${net.toFixed(2)} net yield opportunity: ${name}\nTry the scanner: ${location.origin}`;
      if (navigator.share) {
        navigator.share({ title: 'Venmo Opportunity', text }).catch(() => {});
      } else {
        navigator.clipboard.writeText(text).then(() => alert('Copied to clipboard!'));
      }
    };

    document.getElementById('scan').onclick = scan;
    document.getElementById('balance').onclick = checkBalance;
    document.getElementById('export').onclick = exportCSV;

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js').catch(() => {});
    }
  </script>
</body>
</html>
